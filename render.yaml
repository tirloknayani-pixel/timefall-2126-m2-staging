services:
  - type: web
    name: timefall-2126-m5-staging
    runtime: node
    branch: m5-staging
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
    numInstances: 1
