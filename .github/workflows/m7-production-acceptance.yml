name: M7 Production Acceptance
on:
  push:
    branches: [m7-release]
jobs:
  production-browser-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BASE_URL: https://timefall-2126-final.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Build release harness prerequisites
        run: npm run build:app
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Resolve Chromium path
        run: |
          CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' | head -n 1)"
          test -x "$CHROME"
          echo "CHROMIUM_PATH=$CHROME" >> "$GITHUB_ENV"
      - name: M6 release polish acceptance
        run: set -o pipefail; node tests/m6-browser.mjs 2>&1 | tee m6-browser.log
      - name: M2 multiplayer regression
        run: set -o pipefail; node tests/multiplayer-browser.mjs 2>&1 | tee m2-browser.log
      - name: M3 survival regression
        run: set -o pipefail; node tests/survival-browser.mjs 2>&1 | tee m3-browser.log
      - name: M4 facility regression
        run: set -o pipefail; node tests/facility-browser.mjs 2>&1 | tee m4-browser.log
      - name: M5 portal/full-journey regression
        run: set -o pipefail; node tests/portal-browser.mjs 2>&1 | tee m5-browser.log
      - name: Upload M7 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-production-browser-evidence
          path: |
            *-browser.log
            test-evidence/**
          if-no-files-found: ignore
